name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            output_name: DFIRlogbook.exe
            asset_name: DFIRlogbook-windows-x64.exe
          - os: ubuntu-latest
            label: linux
            output_name: DFIRlogbook
            asset_name: DFIRlogbook-linux-x64
          - os: macos-latest
            label: macos
            output_name: DFIRlogbook
            asset_name: DFIRlogbook-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DFIRlogbook DFIRlogbook.py

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "dist/${{ matrix.output_name }}" "release-assets/${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-binary
          path: release-assets/${{ matrix.asset_name }}
          if-no-files-found: error

  upload-release-assets:
    name: Upload assets to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-binary*"
          merge-multiple: true

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.release.tag_name }}
